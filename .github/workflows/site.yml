# サイトのデータの自動更新
# - 毎日 4:00（日本時間）: 新着動画の検索・リンク切れの削除・エージェント/マップ情報の更新 → 変更があればコミット
# - 公開は Vercel が main への push を検知して自動で行う（https://lineup-archive.vercel.app）
# - Actions タブの Run workflow から手動でも実行できる
name: データの自動更新

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: エージェント・マップ情報の更新
        run: npm run meta

      - name: 新着動画の検索（登録チャンネルの RSS）
        run: npm run discover

      # 以下は外部サービスの一時的な不調で失敗しても、他の更新は続ける
      - name: ショート動画の判定
        run: npm run shorts
        continue-on-error: true

      - name: リンク切れの削除
        run: npm run verify -- --prune
        continue-on-error: true

      - name: X ポストの動画情報の更新
        run: npm run x-media -- --prune
        continue-on-error: true

      - name: videos.json / posts.json の生成
        run: npm run merge

      - name: 変更をコミット
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m "データの自動更新 ($(TZ=Asia/Tokyo date +%F))"
            git push
          fi
